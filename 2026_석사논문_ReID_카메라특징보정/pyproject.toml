[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reid-calib"
version = "0.1.0"
description = "Training-free retrieval-time camera calibration for person re-identification: per-camera mean subtraction, standard evaluation and paired bootstrap CIs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ehlee"}]
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
extract = ["torch>=1.13", "torchvision>=0.14", "pillow>=9", "yacs>=0.1.8"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
