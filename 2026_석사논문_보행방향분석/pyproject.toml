[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "walkdir"
version = "0.1.0"
description = "Walking-direction analysis of person Re-ID camera galleries from body keypoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib", "pyyaml", "pillow"]

[project.optional-dependencies]
pose = ["controlnet_aux==0.0.10", "opencv-python", "torch"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
