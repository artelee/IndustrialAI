[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "campose"
version = "0.1.0"
description = "Camera-aware selection of generation poses by walking-direction distribution, rendered like the generator's reference poses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "scikit-learn", "opencv-python", "pillow", "matplotlib", "pyyaml"]

[project.optional-dependencies]
pose = ["controlnet_aux==0.0.10", "torch"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
